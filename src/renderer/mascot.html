<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'"
    />
    <title>Nudge Mascot</title>
    <style>
      /* The window is transparent; anything opaque here would paint a
         rectangle over the user's desktop. */
      html,
      body,
      #root {
        background: transparent !important;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/mascot.tsx"></script>
  </body>
</html>
